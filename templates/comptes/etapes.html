<ol class="mb-7 flex items-center gap-2 text-xs font-bold sm:text-sm" aria-label="Étapes de l'inscription">
  {% with e=etape|stringformat:"s" %}
  <li class="flex items-center gap-2 {% if e == '1' %}text-vert{% else %}text-encre{% endif %}" {% if e == '1' %}aria-current="step"{% endif %}><span class="grid size-6 shrink-0 place-items-center rounded-full {% if e == '1' %}bg-orange text-white{% else %}bg-vert text-white{% endif %}">1</span><span class="hidden sm:inline">Type de compte</span></li>
  <li class="h-px flex-1 bg-ligne" aria-hidden="true"></li>
  <li class="flex items-center gap-2 {% if e == '2' %}text-vert{% else %}text-encre{% endif %}" {% if e == '2' %}aria-current="step"{% endif %}><span class="grid size-6 shrink-0 place-items-center rounded-full {% if e == '2' %}bg-orange text-white{% elif e == '3' %}bg-vert text-white{% else %}bg-gris text-encre{% endif %}">2</span><span class="hidden sm:inline">Informations</span></li>
  <li class="h-px flex-1 bg-ligne" aria-hidden="true"></li>
  <li class="flex items-center gap-2 {% if e == '3' %}text-vert{% else %}text-encre{% endif %}" {% if e == '3' %}aria-current="step"{% endif %}><span class="grid size-6 shrink-0 place-items-center rounded-full {% if e == '3' %}bg-orange text-white{% else %}bg-gris text-encre{% endif %}">3</span><span class="hidden sm:inline">Vérification de l'e-mail</span></li>
  {% endwith %}
</ol>
<p class="-mt-4 mb-6 text-xs sm:hidden">Étape {{ etape }} sur 3</p>

{% if page.has_other_pages %}
<nav class="mt-10 flex items-center justify-center gap-2" aria-label="Pagination">
  {% if page.has_previous %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}" class="btn btn-contour">Précédent</a>{% endif %}
  <span class="px-3 text-sm">Page {{ page.number }} sur {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}" class="btn btn-contour">Suivant</a>{% endif %}
</nav>
{% endif %}

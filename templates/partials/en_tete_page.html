{# En-tête vert des pages intérieures. Paramètres : surtitre, titre, intro #}
<section class="relative isolate overflow-hidden bg-vert text-white">
  {% include "partials/reseau_deco.html" %}
  <div class="conteneur relative py-14 sm:py-20">
    <p class="surtitre surtitre-trait text-white/85">{{ surtitre }}</p>
    <h1 class="mt-3 text-4xl leading-none font-bold text-white sm:text-6xl lg:text-7xl">{{ titre }}</h1>
    {% if intro %}<p class="mt-5 max-w-xl text-base text-white/90 sm:text-lg">{{ intro }}</p>{% endif %}
    {{ contenu_extra|default:"" }}
  </div>
</section>
